<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>html,body{background:transparent;overflow:hidden}</style>
</head><body>
<div id="w" class="wheel-box"></div>
<script src="wheel.js"></script>
<script>
let ctl = null, lastHover = -1;
dreh.onWheelShow((d) => {
  const box = document.getElementById('w');
  ctl = Wheel.mount(box, d);
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
});
dreh.onWheelHover((i) => { if (ctl) ctl.setHover(i); });
dreh.onWheelMode((m) => { if (ctl) ctl.setMode(m); });
</script>
</body></html>
