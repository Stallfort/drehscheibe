<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Drehscheibe</title>
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;flex-direction:column;padding:22px 24px 18px;gap:16px;user-select:none;-webkit-user-select:none;background:
  radial-gradient(900px 500px at 85% -10%,rgba(255,143,73,.16),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(96,149,250,.14),transparent 60%),var(--bg)}
body.wheel-open{cursor:crosshair}
header{display:flex;align-items:center;gap:14px}
header img{width:48px;height:48px}
h1{font-size:24px;margin:0;letter-spacing:.08em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);margin:0;font-size:13px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(21,29,44,.82);border:1px solid var(--line);border-radius:18px;padding:16px;gap:14px;transition:border-color .15s,background .15s}
body.dragging .stage{border-color:var(--accent);background:rgba(32,41,59,.92)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:min-content;gap:12px;align-content:start}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;padding:20px}
.empty b{color:var(--fg);font-size:17px}
.btn{font:600 13px var(--font);background:var(--grad);color:#0d1321;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 10px;font-weight:500}
.tile{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:grab;transition:border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.off{opacity:.5;cursor:not-allowed}
.thumb{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--c-x)) 16%,var(--surface))}
.ext{font:600 13px var(--mono);text-transform:uppercase;color:#10121c;background:var(--tc,var(--c-x));padding:3px 9px;border-radius:6px}
.meta{padding:7px 2px 1px;min-width:0}
.meta b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{font:400 11px var(--mono);color:var(--muted)}
.chk,.rm{position:absolute;top:12px;width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:rgba(13,19,33,.78);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;font:600 13px var(--mono)}
.chk{left:12px}.rm{right:12px}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"]::after{content:"✓"}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.bar .sp{flex:1}
footer{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;color:var(--muted);font-size:12.5px}
footer label{display:flex;gap:7px;align-items:center;cursor:pointer}
footer input{accent-color:var(--accent)}
.st{font:400 11.5px var(--mono)}
.st.bad{color:var(--err)}
#layer{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle at var(--wx) var(--wy),transparent 130px,rgba(0,0,0,.35) 460px)}
#layer .wheel-box{position:fixed}
</style></head>
<body>
<header>
  <img src="icon.png" alt="">
  <div><h1>Drehscheibe</h1><p class="tag">Datei drücken, zum Format ziehen, loslassen.</p></div>
</header>

<section class="stage" aria-label="Bühne">
  <div class="grid" id="grid"></div>
  <div class="bar">
    <span><kbd>Strg</kbd> + auf eine Datei drücken, zum Format ziehen, loslassen</span>
    <span class="sp"></span>
    <button class="btn ghost" id="pick" type="button">Dateien wählen</button>
    <button class="btn ghost" id="clear" type="button">Leeren</button>
  </div>
</section>

<footer>
  <label><input type="checkbox" id="s-ctrlClick"> Strg + Klick auf Desktop und Explorer</label>
  <label><input type="checkbox" id="s-contextMenu"> Rechtsklick-Menü</label>
  <label><input type="checkbox" id="s-autostart"> Mit Windows starten</label>
  <span class="sp" style="flex:1"></span>
  <span class="st" id="env"></span>
</footer>
<div id="layer"></div>

<script src="wheel.js"></script>
<script src="stage.js"></script>
</body></html>
