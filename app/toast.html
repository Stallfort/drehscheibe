<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
html,body{background:transparent;overflow:hidden}
#list{display:flex;flex-direction:column;gap:8px;padding:0}
.row{height:54px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;background:rgba(21,29,44,.97);border:1px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 8px 28px rgba(0,0,0,.5);cursor:default}
.row.ok{cursor:pointer}
.ring{position:relative;width:38px;height:38px}
.ring svg{transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font:600 10px var(--mono);font-style:normal}
.t{min-width:0;display:flex;flex-direction:column}
.t b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok .t span{color:var(--ok)}.err .t span{color:var(--err)}
@keyframes spin{to{transform:rotate(360deg)}}
.ind svg{animation:spin 1s linear infinite}
</style>
</head><body>
<div id="list"></div>
<script>
const R = 15, CIRC = 2 * Math.PI * R;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = [];
dreh.onJobs((jobs) => {
  current = jobs;
  document.getElementById('list').innerHTML = jobs.map((j) => {
    let ring, sub;
    if (j.state === 'ok') { ring = `<svg width="38" height="38"><circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--ok)" stroke-width="3"/></svg><i style="color:var(--ok)">✓</i>`; sub = `Fertig · ${esc(j.label)} · Ordner öffnen`; }
    else if (j.state === 'err') { ring = `<svg width="38" height="38"><circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--err)" stroke-width="3"/></svg><i style="color:var(--err)">!</i>`; sub = esc(j.msg || ''); }
    else {
      const p = j.pct == null ? 25 : j.pct;
      ring = `<svg width="38" height="38"><circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - p / 100)}"/></svg>` + (j.pct == null ? '' : `<i>${j.pct} %</i>`);
      sub = `→ ${esc(j.label)}`;
    }
    return `<div class="row ${j.state}${j.state === 'work' && j.pct == null ? ' ind' : ''}" data-id="${j.id}"><div class="ring">${ring}</div><div class="t"><b>${esc(j.name)}</b><span>${sub}</span></div></div>`;
  }).join('');
});
document.addEventListener('click', (e) => {
  const r = e.target.closest('.row.ok'); if (!r) return;
  const j = current.find((x) => x.id == r.dataset.id);
  if (j && j.out) dreh.openFolder(j.out);
});
</script>
</body></html>
